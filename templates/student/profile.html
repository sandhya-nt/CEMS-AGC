{% extends "base.html" %}
{% block title %}My Profile — CEMS{% endblock %}
{% block breadcrumb %}Profile{% endblock %}

{% block content %}
<div class="cems-page-header">
  <div class="cems-page-header-top">
    <div>
      <h1 class="cems-page-title">My Profile</h1>
      <p class="cems-page-description">View and update your personal information.</p>
    </div>
  </div>
</div>

<div class="cems-card" style="max-width: 700px;">
  <div class="cems-card-body">
    <div id="profile-error-container"></div>
    <div id="profile-success-container"></div>
    <form method="post" class="cems-form-grid" id="profile-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="cems-form-group">
        <label class="cems-form-label">Full Name</label>
        <input type="text" name="name" class="cems-form-input" value="{{ current_user.name }}" required>
      </div>
      <div class="cems-form-group">
        <label class="cems-form-label">Email Address</label>
        <input type="email" value="{{ current_user.email }}" disabled style="background: var(--cems-bg-tertiary); color: var(--cems-text-muted);">
      </div>
      <div class="cems-form-group">
        <label class="cems-form-label">Mobile Number</label>
        <input type="tel" name="mobile" class="cems-form-input" value="{{ current_user.mobile or '' }}" placeholder="+91 XXXXX XXXXX">
      </div>
      <div class="cems-form-group">
        <label class="cems-form-label">Department</label>
        <input type="text" name="department" class="cems-form-input" value="{{ current_user.department or '' }}" placeholder="Your department">
      </div>
      <div class="cems-form-group">
        <label class="cems-form-label">College Roll No.</label>
        <input type="text" name="roll_no" class="cems-form-input" value="{{ current_user.roll_no or '' }}" placeholder="Your roll number">
      </div>
      <div class="cems-form-group">
        <label class="cems-form-label">Course / Program</label>
        <input type="text" name="course" class="cems-form-input" value="{{ current_user.course or '' }}" placeholder="e.g. B.Tech Computer Science">
      </div>
      <div class="cems-form-group">
        <label class="cems-form-label">Semester</label>
        <select name="semester" class="cems-form-select">
          <option value="">Select Semester</option>
          <option value="1" {% if current_user.semester == '1' %}selected{% endif %}>1st Semester</option>
          <option value="2" {% if current_user.semester == '2' %}selected{% endif %}>2nd Semester</option>
          <option value="3" {% if current_user.semester == '3' %}selected{% endif %}>3rd Semester</option>
          <option value="4" {% if current_user.semester == '4' %}selected{% endif %}>4th Semester</option>
          <option value="5" {% if current_user.semester == '5' %}selected{% endif %}>5th Semester</option>
          <option value="6" {% if current_user.semester == '6' %}selected{% endif %}>6th Semester</option>
          <option value="7" {% if current_user.semester == '7' %}selected{% endif %}>7th Semester</option>
          <option value="8" {% if current_user.semester == '8' %}selected{% endif %}>8th Semester</option>
        </select>
      </div>
      <button type="submit" class="cems-btn cems-btn-primary">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        Update Profile
      </button>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function() {
  const form = document.getElementById('profile-form');
  const errorContainer = document.getElementById('profile-error-container');
  const successContainer = document.getElementById('profile-success-container');
  const submitBtn = form.querySelector('button[type="submit"]');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    errorContainer.innerHTML = '';
    successContainer.innerHTML = '';

    const formData = new FormData(form);
    const localErrors = {};

    if (!formData.get('name')) {
      localErrors['name'] = 'Name is required.';
      form.name.closest('.cems-form-group').classList.add('has-error');
    }

    if (Object.keys(localErrors).length > 0) {
      for (const [field, msg] of Object.entries(localErrors)) {
        const div = document.createElement('div');
        div.className = 'cems-auth-error';
        div.dataset.field = field;
        div.textContent = msg;
        errorContainer.appendChild(div);
      }
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Saving...';

    fetch('{{ url_for("api_update_profile") }}', {
      method: 'POST',
      body: formData,
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(response => response.json())
    .then(data => {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Update Profile';
      if (data.success) {
        const div = document.createElement('div');
        div.className = 'cems-auth-error';
        div.style.borderColor = 'var(--cems-success)';
        div.style.background = 'var(--cems-success-bg)';
        div.style.color = 'var(--cems-success-dark)';
        div.textContent = data.message;
        successContainer.appendChild(div);
        // Update the name in the welcome message on dashboard if present
        const welcomeEl = document.querySelector('.cems-page-title');
        if (welcomeEl && welcomeEl.textContent.includes('{{ current_user.name }}')) {
          welcomeEl.textContent = welcomeEl.textContent.replace('{{ current_user.name }}', formData.get('name'));
        }
      } else {
        if (data.errors) {
          for (const [field, msg] of Object.entries(data.errors)) {
            const div = document.createElement('div');
            div.className = 'cems-auth-error';
            div.dataset.field = field;
            div.textContent = msg;
            errorContainer.appendChild(div);
            const input = form.querySelector(`[name="${field}"]`);
            if (input) input.closest('.cems-form-group').classList.add('has-error');
          }
        }
      }
    })
    .catch(err => {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Update Profile';
      const div = document.createElement('div');
      div.className = 'cems-auth-error';
      div.dataset.field = 'general';
      div.textContent = 'Network error. Please try again.';
      errorContainer.appendChild(div);
      console.error(err);
    });
  });

  // Clear field errors on input
  form.querySelectorAll('input').forEach(input => {
    input.addEventListener('input', () => {
      const group = input.closest('.cems-form-group');
      if (group) group.classList.remove('has-error');
      const fieldErrors = errorContainer.querySelectorAll(`[data-field="${input.name}"]`);
      fieldErrors.forEach(el => el.remove());
    });
  });
})();
</script>
{% endblock %}
