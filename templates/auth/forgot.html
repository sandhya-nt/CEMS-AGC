{% extends "base.html" %}
{% block title %}Forgot Password — CEMS{% endblock %}
{% block content %}
<div class="narrow-card"><div class="big-icon">✉</div><h1>Forgot Password</h1><p class="muted">Enter your email and we will generate a secure reset link.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email Address<input type="email" name="email" required placeholder="Enter your email"></label><button class="btn full">Send Reset Link</button></form><a class="back" href="{{ url_for('login') }}">← Back to Login</a></div>
{% endblock %}
